server:
  port: ${PORT:8080}
  max-http-request-header-size: 65536
  tomcat:
    max-http-response-header-size: 65536
  servlet:
    context-path: /api/v1

spring:
  application:
    name: horario-backend
  datasource:
    url: jdbc:h2:mem:horariodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 horas
  rate-limit:
    daily-quota: 6
    unlimited-emails:
      - joan.laurente@utp.edu.pe
      - admin@utp.edu.pe
  openrouter:
    api-url: https://openrouter.ai/api/v1/chat/completions
    api-key: ${OPENROUTER_API_KEY:}
    models:
      - arcee-ai/arcee-agent
      - qwen/qwen-2.5-coder-32b-instruct
      - meta-llama/llama-3.3-70b-instruct
