server:
  port: ${PORT:8080}
  max-http-request-header-size: 65536
  tomcat:
    max-http-response-header-size: 65536
  servlet:
    context-path: /api/v1

spring:
  application:
    name: utp-academic-gateway
  datasource:
    url: jdbc:h2:mem:academicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

supabase:
  enabled: ${SUPABASE_ENABLED:true}
  url: ${SUPABASE_URL:https://vngkmsmyuuukyzvqbovs.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  anon-key: ${SUPABASE_ANON_KEY:}
  table: ${SUPABASE_SYLLABI_TABLE:official_syllabi}

ai:
  openrouter:
    enabled: ${OPENROUTER_ENABLED:true}
    api-url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1}
    primary-model: ${OPENROUTER_PRIMARY_MODEL:qwen/qwen3.8-27b:free}
    fallback-models:
      - google/gemma-4-26b-a4b-it:free
      - liquid/lfm-2.5-2.6b:free

utp:
  # Namespace UUID v5 de la plataforma UTP+Class, usado para derivar el 'paoUserId'
  # de cada alumno (uuidv5(namespace, email_en_mayusculas)), igual que hace la SPA oficial.
  # Sobrescribible si la plataforma cambia su namespace.
  pao-uuid-namespace: ${UTP_PAO_UUID_NAMESPACE:6ba7b810-9dad-11d1-80b4-00c04fd430c8}
  # Correspondencia PAO (userId) por codigo de alumno: "<codigoAlumno>=<paoUserId>,<otro>=<otroPaoUserId>".
  # IMPRESCINDIBLE: el portal UTP+ Class (PAO) exige la cabecera 'user-id' con el paoUserId,
  # que NO viaja en el JWT de Keycloak (solo el 'sub' de la cuenta SSO). Sin esta correspondencia
  # los endpoints PAO de silabo y calendario responden 403 y el alumno no recibe datos.
  # NOTA: en operacion normal NO es necesaria: el paoUserId se deriva de forma determinista
  # del correo institucional. Se mantiene como respaldo/excepcion.
  # Fallback: variable de entorno UTP_PAO_USER_MAP.
  pao-user-map: ${UTP_PAO_USER_MAP:}
  # Verificacion criptografica de la firma de los tokens del SSO (realm Xpedition).
  # Modos: off (no verifica) | audit (verifica y registra, no rechaza) | enforce (rechaza con 401).
  # Se cambia en caliente con 'heroku config:set UTP_JWT_MODE=enforce', sin redesplegar.
  security:
    jwt:
      mode: ${UTP_JWT_MODE:off}
      issuer: ${UTP_JWT_ISSUER:https://sso.utp.edu.pe/auth/realms/Xpedition}
      jwks-url: ${UTP_JWT_JWKS_URL:https://sso.utp.edu.pe/auth/realms/Xpedition/protocol/openid-connect/certs}
      jwks-cache-ttl-seconds: ${UTP_JWT_JWKS_TTL:21600}
      jwks-timeout-seconds: ${UTP_JWT_JWKS_TIMEOUT:3}
      clock-skew-seconds: ${UTP_JWT_CLOCK_SKEW:60}
      # Si el JWKS no se puede descargar (caida del SSO), la peticion no se rechaza.
      fail-open: ${UTP_JWT_FAIL_OPEN:true}
    # Limite de intentos de autenticacion (fuerza bruta contra el SSO institucional).
    rate-limit:
      enabled: ${UTP_RATE_LIMIT_ENABLED:true}
      max-requests-per-window: ${UTP_RATE_LIMIT_MAX_REQUESTS:10}
      max-failures-per-window: ${UTP_RATE_LIMIT_MAX_FAILURES:5}
      window-seconds: ${UTP_RATE_LIMIT_WINDOW:60}

app:
  jwt:
    # Secreto de firma JWT. NUNCA debe versionarse con un valor literal:
    # se inyecta desde el entorno / secret manager del despliegue.
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000 # 24 horas
