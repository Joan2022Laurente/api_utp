server:
  port: ${PORT:8080}
  max-http-request-header-size: 65536
  tomcat:
    max-http-response-header-size: 65536
  servlet:
    context-path: /api/v1

spring:
  application:
    name: utp-academic-gateway
  datasource:
    url: jdbc:h2:mem:academicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 horas

